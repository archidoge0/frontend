name: GHAV frontend 22826 complete supervisor build
on:
  push:
    branches: ['codex/ghav-front22826-supervisor-v1-*']
permissions:
  contents: read
env:
  NODE_OPTIONS: --max_old_space_size=6144 --no-experimental-require-module
  YARN_NPM_REGISTRY_SERVER: https://registry.npmmirror.com
jobs:
  supervisor:
    name: Complete frontend supervisor build job
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fixed historical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 39b00f1063b4517e7a9ee50665837e883858c89a
          persist-credentials: false
      - name: Setup exact Node and Yarn package cache
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.20.2
          cache: yarn
      - name: Restore node_modules cache
        id: yarn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: ghav-front22826-supervisor-v1-${{ runner.os }}-yarn-${{ hashFiles('.yarnrc.yml') }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable
      - name: Verify locked historical dependency and context
        shell: bash
        run: |
          test "$(yarn config get npmRegistryServer)" = 'https://registry.npmmirror.com'
          test "$(node -p 'process.features.require_module')" = false
          test "$(node -p "JSON.parse(require('fs').readFileSync('node_modules/tsparticles-preset-links/package.json', 'utf8')).version")" = '2.12.0'
          echo "GHAV_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "GHAV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "GHAV_YARN_LOCK_SHA=$(sha256sum yarn.lock | cut -d ' ' -f1)"
          echo "GHAV_YARN_RC_SHA=$(sha256sum .yarnrc.yml | cut -d ' ' -f1)"
          echo "GHAV_NODE_VERSION=$(node --version)"
          echo "GHAV_YARN_VERSION=$(yarn --version)"
          echo "GHAV_HIST_PACKAGE_TREE_SHA=$(find node_modules/tsparticles-preset-links -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          echo "GHAV_NODE_MODULES_CACHE_HIT=${{ steps.yarn-cache.outputs.cache-hit }}"
      - name: Build complete supervisor application
        run: ./node_modules/.bin/gulp build-hassio
        env:
          IS_TEST: 'true'
      - name: Record full stats output witness
        run: |
          test -d build/stats
          echo "GHAV_STATS_FILE_COUNT=$(find build/stats -name '*.json' -type f | wc -l | tr -d ' ')"
          echo "GHAV_STATS_MANIFEST_SHA=$(find build/stats -name '*.json' -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          echo "GHAV_SOURCE_SHA_AFTER=$(git rev-parse HEAD)"
          echo "GHAV_YARN_LOCK_SHA_AFTER=$(sha256sum yarn.lock | cut -d ' ' -f1)"
          echo "GHAV_NODE_MODULES_LOCK_SHA=$(sha256sum node_modules/.yarn-state.yml | cut -d ' ' -f1)"
          echo "GHAV_TRACKED_DIFF_LINES=$(git diff --numstat | wc -l | tr -d ' ')"
      - name: Upload complete supervisor bundle stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supervisor-bundle-stats
          path: build/stats/*.json
          if-no-files-found: error
