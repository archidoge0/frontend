name: GHAV frontend 19381 v2 lint before

on:
  push:
    branches: ["codex/ghav-fe19381-v2-before"]

permissions:
  contents: read

env:
  NODE_OPTIONS: --max_old_space_size=6144 --no-experimental-require-module
  GITHUB_TOKEN: ""
  YARN_NPM_REGISTRY_SERVER: https://registry.npmmirror.com

jobs:
  lint:
    name: Full lint and format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fixed Before source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6cdf1c168910edc778ebed0910c6bd42e1684ece
      - name: Verify fixed source snapshot
        run: |
          test "$(git rev-parse HEAD)" = '6cdf1c168910edc778ebed0910c6bd42e1684ece'
          test "$(git rev-parse HEAD^{tree})" = '1bb4041d0b4c2bb920eb906e94f3d7f6a982e783'
          test "$(sha256sum tsconfig.json | cut -d ' ' -f1)" = '7cbf3363bcb1e875e2131ed3689859186049769e32abce9923b4c29bbe2cc645'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check for duplicate dependencies
        run: yarn dedupe --check
      - name: Build resources
        run: ./node_modules/.bin/gulp gen-icons-json build-translations build-locale-data gather-gallery-pages
      - name: Setup lint cache
        id: lint_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules/.cache/prettier
            node_modules/.cache/eslint
          key: ghav-fe19381-v2-before-lint-${{ github.sha }}
          restore-keys: ghav-fe19381-v2-before-lint-
      - name: Run eslint
        run: yarn run lint:eslint --quiet
      - name: Run tsc
        run: yarn run lint:types
      - name: Run lit-analyzer
        run: yarn run lint:lit --quiet
      - name: Run prettier
        run: yarn run lint:prettier
      - name: Record check and cache witness
        if: always()
        run: |
          echo "source=$(git rev-parse HEAD)"
          echo "source_tree=$(git rev-parse HEAD^{tree})"
          echo "tsconfig_sha=$(sha256sum tsconfig.json | cut -d ' ' -f1)"
          echo "lint_cache_hit=${{ steps.lint_cache.outputs.cache-hit }}"
          find node_modules/.cache/typescript -maxdepth 1 -type f -print -exec sha256sum {} \; 2>/dev/null || true
